<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" role="img" aria-label="Apex Detail Trimmer, slim matte black outlining trimmer with gold band">
  <defs>
    <linearGradient id="tBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2e"/><stop offset="0.18" stop-color="#1a1a1d"/>
      <stop offset="0.45" stop-color="#0c0c0e"/><stop offset="0.75" stop-color="#101013"/>
      <stop offset="1" stop-color="#232327"/>
    </linearGradient>
    <linearGradient id="tSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.35" stop-color="#b9b9c0"/>
      <stop offset="0.55" stop-color="#8d8d95"/><stop offset="0.8" stop-color="#c9c9cf"/>
      <stop offset="1" stop-color="#74747c"/>
    </linearGradient>
    <linearGradient id="tGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cf9a"/><stop offset="0.5" stop-color="#c8a66a"/>
      <stop offset="1" stop-color="#8a6f3f"/>
    </linearGradient>
    <linearGradient id="tHL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.32)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- wide T-blade teeth -->
  <g fill="url(#tSteel)">
    <rect x="62" y="28" width="4" height="15" rx="1.2"/><rect x="71" y="28" width="4" height="15" rx="1.2"/>
    <rect x="80" y="28" width="4" height="15" rx="1.2"/><rect x="89" y="28" width="4" height="15" rx="1.2"/>
    <rect x="98" y="28" width="4" height="15" rx="1.2"/><rect x="107" y="28" width="4" height="15" rx="1.2"/>
    <rect x="116" y="28" width="4" height="15" rx="1.2"/><rect x="125" y="28" width="4" height="15" rx="1.2"/>
    <rect x="134" y="28" width="4" height="15" rx="1.2"/><rect x="143" y="28" width="4" height="15" rx="1.2"/>
    <rect x="152" y="28" width="4" height="15" rx="1.2"/><rect x="161" y="28" width="4" height="15" rx="1.2"/>
    <rect x="170" y="28" width="4" height="15" rx="1.2"/>
  </g>
  <!-- T-blade bar, wider than the body -->
  <rect x="56" y="41" width="128" height="13" rx="2.5" fill="url(#tSteel)"/>
  <rect x="70" y="52" width="100" height="11" rx="2.5" fill="#17171a" stroke="#2c2c30" stroke-width="0.5"/>
  <!-- body -->
  <path d="M80 62 L160 62 L154 302 Q154 336 120 336 Q86 336 86 302 Z" fill="url(#tBody)"/>
  <rect x="142" y="76" width="5" height="190" rx="2.5" fill="url(#tHL)" opacity="0.45"/>
  <!-- gold collar -->
  <rect x="80" y="66" width="80" height="6" fill="url(#tGold)" opacity="0.92"/>
  <!-- wordmark -->
  <text x="120" y="150" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="4.5" font-weight="600" fill="#5c5c63">APEX</text>
  <!-- slider switch -->
  <rect x="112" y="196" width="16" height="46" rx="8" fill="#101013" stroke="#34343a" stroke-width="1"/>
  <circle cx="120" cy="208" r="6" fill="url(#tGold)"/>
  <!-- LED dot -->
  <circle cx="120" cy="266" r="7" fill="#6fa9d8" opacity="0.14"/>
  <circle cx="120" cy="266" r="3.2" fill="#cfeaff" opacity="0.95"/>
</svg>
