<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" role="img" aria-label="Apex Pro Clipper, matte black cordless clipper with gold detailing">
  <defs>
    <linearGradient id="cBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2e"/><stop offset="0.18" stop-color="#1a1a1d"/>
      <stop offset="0.45" stop-color="#0c0c0e"/><stop offset="0.75" stop-color="#101013"/>
      <stop offset="1" stop-color="#232327"/>
    </linearGradient>
    <linearGradient id="cSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.35" stop-color="#b9b9c0"/>
      <stop offset="0.55" stop-color="#8d8d95"/><stop offset="0.8" stop-color="#c9c9cf"/>
      <stop offset="1" stop-color="#74747c"/>
    </linearGradient>
    <linearGradient id="cGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cf9a"/><stop offset="0.5" stop-color="#c8a66a"/>
      <stop offset="1" stop-color="#8a6f3f"/>
    </linearGradient>
    <linearGradient id="cHL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.32)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="cLed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaff"/><stop offset="1" stop-color="#6fa9d8"/>
    </linearGradient>
  </defs>
  <!-- blade teeth -->
  <g fill="url(#cSteel)">
    <rect x="78" y="26" width="4" height="16" rx="1.2"/><rect x="86" y="26" width="4" height="16" rx="1.2"/>
    <rect x="94" y="26" width="4" height="16" rx="1.2"/><rect x="102" y="26" width="4" height="16" rx="1.2"/>
    <rect x="110" y="26" width="4" height="16" rx="1.2"/><rect x="118" y="26" width="4" height="16" rx="1.2"/>
    <rect x="126" y="26" width="4" height="16" rx="1.2"/><rect x="134" y="26" width="4" height="16" rx="1.2"/>
    <rect x="142" y="26" width="4" height="16" rx="1.2"/><rect x="150" y="26" width="4" height="16" rx="1.2"/>
    <rect x="158" y="26" width="4" height="16" rx="1.2"/>
  </g>
  <!-- blade plates -->
  <rect x="70" y="40" width="100" height="16" rx="3" fill="url(#cSteel)"/>
  <rect x="66" y="54" width="108" height="14" rx="3" fill="#17171a" stroke="#2c2c30" stroke-width="0.5"/>
  <!-- body -->
  <path d="M72 66 L168 66 L164 298 Q164 338 120 338 Q76 338 76 298 Z" fill="url(#cBody)"/>
  <rect x="82" y="78" width="6" height="200" rx="3" fill="url(#cHL)" opacity="0.5"/>
  <!-- taper lever -->
  <rect x="48" y="112" width="17" height="46" rx="5" fill="#141416" stroke="#2e2e33" stroke-width="1"/>
  <rect x="53" y="119" width="7" height="7" rx="2" fill="url(#cGold)"/>
  <!-- wordmark -->
  <text x="122" y="152" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="5" font-weight="600" fill="#5c5c63">APEX</text>
  <!-- power button -->
  <circle cx="120" cy="210" r="16" fill="#08080a" stroke="url(#cGold)" stroke-width="1.6"/>
  <path d="M120 201 v9" stroke="url(#cGold)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M113.5 206 a9.5 9.5 0 1 0 13 0" stroke="url(#cGold)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- LED level -->
  <rect x="114.5" y="251" width="11" height="30" rx="5" fill="url(#cLed)" opacity="0.16"/>
  <rect x="117" y="254" width="6" height="24" rx="3" fill="url(#cLed)" opacity="0.95"/>
  <!-- grip hints -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <path d="M94 300 h52"/><path d="M92 308 h56"/><path d="M94 316 h52"/>
  </g>
  <path d="M78 292 h84" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
</svg>
