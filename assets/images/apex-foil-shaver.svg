<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" role="img" aria-label="Apex Foil Shaver, dual-foil electric shaver with gold divider">
  <defs>
    <linearGradient id="sBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2e"/><stop offset="0.18" stop-color="#1a1a1d"/>
      <stop offset="0.45" stop-color="#0c0c0e"/><stop offset="0.75" stop-color="#101013"/>
      <stop offset="1" stop-color="#232327"/>
    </linearGradient>
    <linearGradient id="sFoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f4"/><stop offset="0.4" stop-color="#c4c4cb"/>
      <stop offset="0.7" stop-color="#d9d9de"/><stop offset="1" stop-color="#9a9aa2"/>
    </linearGradient>
    <linearGradient id="sGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cf9a"/><stop offset="0.5" stop-color="#c8a66a"/>
      <stop offset="1" stop-color="#8a6f3f"/>
    </linearGradient>
    <linearGradient id="sHL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.32)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- head frame -->
  <rect x="62" y="34" width="116" height="60" rx="22" fill="#121214" stroke="#33333a" stroke-width="1"/>
  <!-- dual foils -->
  <rect x="70" y="42" width="47" height="44" rx="12" fill="url(#sFoil)"/>
  <rect x="123" y="42" width="47" height="44" rx="12" fill="url(#sFoil)"/>
  <!-- foil texture -->
  <g stroke="rgba(20,20,24,0.55)" stroke-width="1">
    <path d="M78 46 v36"/><path d="M86 44 v40"/><path d="M94 44 v40"/><path d="M102 44 v40"/><path d="M110 46 v36"/>
    <path d="M131 46 v36"/><path d="M139 44 v40"/><path d="M147 44 v40"/><path d="M155 44 v40"/><path d="M163 46 v36"/>
  </g>
  <!-- gold divider -->
  <rect x="118" y="44" width="4" height="40" rx="2" fill="url(#sGold)"/>
  <!-- neck -->
  <path d="M84 94 L156 94 L150 120 L90 120 Z" fill="#131316"/>
  <!-- body -->
  <path d="M90 120 L150 120 L154 296 Q154 334 120 334 Q86 334 86 296 Z" fill="url(#sBody)"/>
  <rect x="96" y="132" width="6" height="170" rx="3" fill="url(#sHL)" opacity="0.5"/>
  <!-- wordmark -->
  <text x="120" y="168" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="4.5" font-weight="600" fill="#5c5c63">APEX</text>
  <!-- power button -->
  <circle cx="120" cy="212" r="15" fill="#020203" stroke="url(#sGold)" stroke-width="1.6"/>
  <path d="M120 204 v8.5" stroke="url(#sGold)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M114 208.5 a9 9 0 1 0 12 0" stroke="url(#sGold)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- battery LEDs -->
  <circle cx="104" cy="268" r="2.6" fill="#cfeaff" opacity="0.95"/>
  <circle cx="120" cy="268" r="2.6" fill="#cfeaff" opacity="0.5"/>
  <circle cx="136" cy="268" r="2.6" fill="#cfeaff" opacity="0.22"/>
  <!-- USB-C port -->
  <rect x="108" y="318" width="24" height="7" rx="3.5" fill="#101013" stroke="#33333a" stroke-width="1"/>
</svg>
