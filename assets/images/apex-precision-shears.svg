<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" role="img" aria-label="Apex Precision Shears, polished steel barber shears with gold tension screw">
  <defs>
    <linearGradient id="shSteelA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f4"/><stop offset="0.45" stop-color="#c3c3c9"/>
      <stop offset="0.7" stop-color="#8b8b93"/><stop offset="1" stop-color="#dcdce0"/>
    </linearGradient>
    <linearGradient id="shSteelB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5d5da"/><stop offset="0.5" stop-color="#97979f"/>
      <stop offset="1" stop-color="#f2f2f4"/>
    </linearGradient>
    <linearGradient id="shGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cf9a"/><stop offset="0.5" stop-color="#c8a66a"/>
      <stop offset="1" stop-color="#8a6f3f"/>
    </linearGradient>
  </defs>
  <!-- blades (open, crossing at the pivot) -->
  <polygon points="84,40 96,30 128,174 112,180" fill="url(#shSteelA)"/>
  <path d="M84 40 L112 180" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>
  <polygon points="156,40 144,30 112,174 128,180" fill="url(#shSteelB)"/>
  <path d="M156 40 L128 180" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <!-- shanks -->
  <path d="M126 186 L152 280" stroke="#1a1a1d" stroke-width="11" stroke-linecap="round"/>
  <path d="M114 186 L88 280" stroke="#1a1a1d" stroke-width="11" stroke-linecap="round"/>
  <!-- pivot screw -->
  <circle cx="120" cy="180" r="9.5" fill="#131315" stroke="url(#shGold)" stroke-width="1.6"/>
  <circle cx="120" cy="180" r="3.4" fill="url(#shGold)"/>
  <!-- handle rings -->
  <circle cx="156" cy="298" r="19" fill="none" stroke="#1c1c1f" stroke-width="10"/>
  <circle cx="156" cy="298" r="19" fill="none" stroke="rgba(247,247,255,0.07)" stroke-width="2"/>
  <circle cx="84" cy="298" r="19" fill="none" stroke="#1c1c1f" stroke-width="10"/>
  <circle cx="84" cy="298" r="19" fill="none" stroke="rgba(247,247,255,0.07)" stroke-width="2"/>
  <!-- gold inner ring accents -->
  <circle cx="156" cy="298" r="13" fill="none" stroke="url(#shGold)" stroke-width="1" opacity="0.55"/>
  <circle cx="84" cy="298" r="13" fill="none" stroke="url(#shGold)" stroke-width="1" opacity="0.55"/>
  <!-- finger rest -->
  <path d="M170 310 q13 5 8 19" stroke="#1a1a1d" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>
